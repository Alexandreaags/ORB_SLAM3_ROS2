%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters
#--------------------------------------------------------------------------------------------
File.version: "1.0"
Camera.type: "PinHole"

# Camera 1 (Left) - Intrinsics
Camera1.fx: 1167.87421447215
Camera1.fy: 1166.9553764645004
Camera1.cx: 771.763112280329
Camera1.cy: 589.9626482585169

# Camera 1 - Distortion (radialtangential)
Camera1.k1: -0.16610165879624592
Camera1.k2: 0.1156504557423161
Camera1.p1: -5.9407782773707644e-05
Camera1.p2: 0.0018508320481282106

# Camera 2 (Right) - Intrinsics
Camera2.fx: 1165.9493476066016
Camera2.fy: 1167.2556820541186
Camera2.cx: 752.2788466729131
Camera2.cy: 580.9613365661235

# Camera 2 - Distortion (radialtangential)
Camera2.k1: -0.17863115239034907
Camera2.k2: 0.13121795689445712
Camera2.p1: -6.741741965147593e-05
Camera2.p2: -0.002580879117584875

# Camera Resolution
Camera.width: 1600
Camera.height: 1200

# Camera frames per second (Must be integer)
Camera.fps: 13

# Color order of the images (0: BGR, 1: RGB)
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# Stereo Parameters (Relative pose from Camera 1 to Camera 2)
#--------------------------------------------------------------------------------------------
Stereo.b: 0.2317
Stereo.ThDepth: 40.0

Stereo.T_c1_c2: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [ 0.9987,  0.0326, -0.0358,  0.2316,
         -0.0325,  0.9994,  0.0019, -0.0043,
          0.0358, -0.0006,  0.9991,  0.0058,
          0.0,     0.0,     0.0,     1.0]

#--------------------------------------------------------------------------------------------
# IMU Parameters
#--------------------------------------------------------------------------------------------
# Transformation from Body (IMU) to Camera 1
IMU.T_b_c1: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [-0.0204017431055, -0.000775486330789, 0.999791562026, 0.191223742056,
         0.999705395678, -0.0131673485818, 0.0203897715677, -0.0327723324671,
         0.0131487920172, 0.999913005992, 0.00104389473231, -0.159324369284,
         0.0, 0.0, 0.0, 1.0]

IMU.NoiseGyro: 0.0016017
IMU.NoiseAcc: 0.0071376
IMU.GyroWalk: 0.0000165
IMU.AccWalk: 0.0002874
IMU.Frequency: 100.0

# Adicionado para evitar crash se o rastreamento inercial for perdido em vídeos difíceis
IMU.InsertKfsWhenLost: 1 

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1200
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0